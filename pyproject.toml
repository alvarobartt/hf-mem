[project]
name = "hf-mem"
version = "1.0.0"
description = "A CLI to estimate inference memory requirements for Hugging Face models, written in Python."
readme = "README.md"
authors = [
    { name = "Alvaro Bartolome", email = "alvarobartt@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "httpx2[http2]>=2.12.0",
]

[project.urls]
Homepage = "https://github.com/alvarobartt/hf-mem"
Repository = "https://github.com/alvarobartt/hf-mem"
Issues = "https://github.com/alvarobartt/hf-mem/issues"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
lint = [
    "mypy>=1.18",
    "pre-commit>=4.5.1",
    "pytest>=8",
    "ruff>=0.14.10",
]
test = [
    "pytest>=8",
]

[tool.uv.dependency-groups]
lint = { requires-python = ">=3.11" }

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = ["tests"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 112

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
force-single-line = false

[project.scripts]
hf-mem = "hf_mem.cli:main"
